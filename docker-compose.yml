services:
  mysql:
    image: mysql:8.4
    container_name: cychronos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123qwecc
      MYSQL_DATABASE: cychronos
      MYSQL_USER: cyuser
      MYSQL_PASSWORD: 123qwecc
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./back/db/cydump.sql:/docker-entrypoint-initdb.d/01-cydump.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123qwecc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
